name: CI

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build the static site
        run: npm run build
      - name: Preserve the exact build for browser tests and deployment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site-dist
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Summarize the build
        run: |
          printf '## Build\n\nJavaScript syntax and the static build passed.\n\nThe `site-dist` artifact is reused by browser tests and Pages deployment.\n' >> "$GITHUB_STEP_SUMMARY"

  unit-tests:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run assertions and the mandatory coverage gate
        id: unit-tests
        run: npm run test:coverage
      - name: Generate the coverage badge and job summary
        id: coverage-report
        if: always() && steps.unit-tests.outcome != 'skipped'
        run: npm run report:coverage
      - name: Preserve test and coverage results even on failure
        if: always() && steps.unit-tests.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unit-coverage
          path: coverage
          if-no-files-found: error
          retention-days: 14
      - name: Preserve data for the PR coverage comment
        if: always() && github.event_name == 'pull_request' && steps.coverage-report.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-coverage-${{ github.run_attempt }}
          path: |
            coverage/coverage-summary.json
            coverage/unit-results.json
            coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  browser-tests:
    name: Browser tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Download the build being validated
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site-dist
          path: dist
      - name: Install headless Chromium and system dependencies
        run: npx playwright install --with-deps chromium --only-shell
      - name: Test the built site in Chromium
        id: browser-tests
        run: npm run test:browser
      - name: Summarize browser results
        if: always() && steps.browser-tests.outcome != 'skipped'
        env:
          TEST_OUTCOME: ${{ steps.browser-tests.outcome }}
        run: |
          printf '## Browser tests\n\nResult: **%s**.\n\nHTML and JUnit reports, plus failure screenshots and traces, are in the `browser-results` artifact.\n' "$TEST_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve browser reports even on failure
        if: always() && steps.browser-tests.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-results
          path: |
            playwright-report
            test-results
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy GitHub Pages
    needs: [build, unit-tests, browser-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Download the verified site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site-dist
          path: dist
      - name: Include coverage reports and the generated badge
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: unit-coverage
          path: dist/coverage
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Package the verified deployment
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
      - name: Deploy only after every required check passes
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
